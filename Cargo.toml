[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored code is a path dependency, not a member: its own tests need files
# that aren't imported, and its lints are upstream's.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = "symbols"

# What the gate builds and publishes: `gp model gate` took 3.5 minutes cold on
# this, 10 on a debug build. A one-line change rebuilds gp in seconds.
[profile.fastdev]
inherits = "release"
opt-level = 1
lto = "off"
incremental = true
codegen-units = 256

[profile.fastdev.package."*"]
opt-level = 3

# The emulator is most of a corpus score's time. With lto off it gets no
# cross-unit inlining, so it is built whole and at full optimization.
[profile.fastdev.package.tetanes-core]
opt-level = 3
codegen-units = 1
incremental = false

[profile.dev.package.tetanes-core]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.gp-sound]
opt-level = 3
