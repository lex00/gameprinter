[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored code is a path dependency, not a member: its own tests need files
# that aren't imported, and its lints are upstream's.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = "symbols"

[profile.dev.package.tetanes-core]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.gp-sound]
opt-level = 3
