<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="watch-only">
  <header>
    <span id="logo">GAME PRINTER</span>
    <span id="title">Watch</span>
  </header>
  <main id="watch-main">
    <section class="col" id="watch-col">
      <h2>Your agent</h2>
      <p id="w-status" class="muted">Nothing yet. What your agent is doing shows here.</p>
      <div id="w-pins"></div>
      <table id="w-problems" hidden><thead><tr><th>#</th><th>Where</th><th>What is wrong</th><th>Change</th><th>State</th></tr></thead><tbody></tbody></table>
    </section>
    <section class="col">
      <h2>Conversation</h2>
      <form id="w-say"><input id="w-text" autocomplete="off" placeholder="A note for your agent, then Enter"><button type="submit">SEND</button></form>
      <ol id="w-talk"></ol>
      <details open><summary>Log</summary><ol id="w-log"></ol></details>
    </section>
  </main>
  <script type="module" src="watch.js"></script>
</body>
</html>
