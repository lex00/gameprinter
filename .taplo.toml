# Typed editing for the TOML files of a game's folder and a template
# (schema/README.md). Taplo, Even Better TOML (VS Code) and Zed read this
# file and check each match against a JSON Schema from schema/. The files
# carry no directive of their own: `gp model fmt` rewrites a model to its
# canonical text and drops comments, so a first-line `#:schema` would be
# lost. Schema file names have no version, so the paths never change, and
# a test (crates/gp-cli/tests/schema_mapping.rs) validates every match, in
# this repo and in the games checkout beside it when there is one.
#
# A games checkout opened on its own needs its own .taplo.toml with these
# rules and each path written to this repo's schema/ folder (such as
# "../gameprinter/schema/mapping.json"); schema/README.md has one to copy.

[[rule]]
include = ["**/model.toml"]
[rule.schema]
path = "schema/model-platformer.json"

[[rule]]
include = ["**/fidelity.toml"]
[rule.schema]
path = "schema/contract.json"

[[rule]]
include = ["**/mapping.toml"]
[rule.schema]
path = "schema/mapping.json"

[[rule]]
include = ["**/profiles.toml"]
[rule.schema]
path = "schema/profiles.json"

[[rule]]
include = ["**/corpus.toml"]
[rule.schema]
path = "schema/corpus.json"

[[rule]]
include = ["**/clips.toml", "**/aimed.toml"]
[rule.schema]
path = "schema/clips.json"

[[rule]]
include = ["**/package.toml"]
[rule.schema]
path = "schema/package.json"

[[rule]]
include = ["**/roms.toml"]
[rule.schema]
path = "schema/roms.json"

[[rule]]
include = ["**/theme.toml"]
[rule.schema]
path = "schema/theme.json"

[[rule]]
include = ["**/themes/stack.toml"]
[rule.schema]
path = "schema/theme-stack.json"

[[rule]]
include = ["**/slots.toml"]
[rule.schema]
path = "schema/slots.json"
