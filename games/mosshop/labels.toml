# Moss Hop's RAM map, for tools: the trace inspector's labeled RAM watch,
# selectors such as ram[0x0010], and the labels in baselines/mosshop/.
# ram.inc holds the same names and addresses for the assembler; a test in
# crates/gp-cli/tests/mosshop.rs fails if the two disagree, or if a baseline
# assertion names a label at another address. docs/reference-game.md
# describes each variable.
#
# `addr` is in the console's 2KB of internal RAM; `size` is in bytes, and a
# variable of more than one byte is an array, one entry per enemy (or per
# queued redraw, or per level cell).

schema = 0
game = "mosshop"

[[label]]
name = "FRAMES"
addr = 0x00
size = 1
description = "NMI count, wraps at 256"

[[label]]
name = "NMI_DONE"
addr = 0x01
size = 1
description = "Set by the NMI handler, cleared by the main loop"

[[label]]
name = "PAD"
addr = 0x02
size = 1
description = "Controller 1 this frame: A B Select Start Up Down Left Right, A in bit 7"

[[label]]
name = "PAD_PREV"
addr = 0x03
size = 1
description = "Controller 1 the frame before"

[[label]]
name = "PAD_NEW"
addr = 0x04
size = 1
description = "Buttons down this frame and up the frame before"

[[label]]
name = "STATE"
addr = 0x05
size = 1
description = "0 playing, 1 dying, 2 level clear, 3 game over"

[[label]]
name = "TIMER"
addr = 0x06
size = 1
