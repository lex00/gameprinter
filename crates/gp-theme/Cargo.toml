[package]
name = "gp-theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Themes (docs/formats/theme.md): the theme and stack formats, stacking,
# applying a theme to pictures by role, the readability check and the
# Style metrics. Presentation only: nothing here reads or writes the
# simulation, and floats are fine.
[dependencies]
gp-sound = { version = "0.1.0", path = "../gp-sound" }
gp-model = { version = "0.1.0", path = "../gp-model" }
png = "0.18.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
