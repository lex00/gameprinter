[package]
name = "gp-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
gp-assets = { version = "0.1.0", path = "../gp-assets" }
gp-capture = { version = "0.1.0", path = "../gp-capture" }
gp-contract = { version = "0.1.0", path = "../gp-contract" }
gp-events = { version = "0.1.0", path = "../gp-events" }
gp-evidence = { version = "0.1.0", path = "../gp-evidence" }
gp-look = { version = "0.1.0", path = "../gp-look" }
gp-imagefmt = { version = "0.1.0", path = "../gp-imagefmt" }
gp-interp = { version = "0.1.0", path = "../gp-interp" }
gp-model = { version = "0.1.0", path = "../gp-model" }
gp-present = { version = "0.1.0", path = "../gp-present" }
gp-runtime = { version = "0.1.0", path = "../gp-runtime" }
gp-sim = { version = "0.1.0", path = "../gp-sim" }
gp-sound = { version = "0.1.0", path = "../gp-sound", features = ["schema"] }
gp-sound-bank = { version = "0.1.0", path = "../gp-sound-bank" }
gp-theme = { version = "0.1.0", path = "../gp-theme" }
png = "=0.18.1"
# The official Rust MCP SDK (modelcontextprotocol/rust-sdk), server side
# and stdio only: no HTTP, auth or macros (docs/mcp.md).
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt", "time"] }
toml = "1.1.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
