[package]
name = "gp-web-lift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# A visitor's own ROM, lifted in their browser (docs/web.md, "The public
# page"): `gp-web-lift ROM TEMPLATE OUT` checks the ROM's hash against the
# template's `source.accepts`, lifts it with the template's asset map, and
# writes what the interpreter preview loads, as gp-web-prep does. The
# library's `prep` is gp-web-prep's own code, so both write the same files.
# It is built for wasm32-wasip1 (scripts/web/build-lift.sh) and run in the
# page under scripts/web/public/wasi.js, an in-memory file system, so the
# ROM never leaves the browser.
[dependencies]
gp-assets = { version = "0.1.0", path = "../gp-assets" }
gp-evidence = { version = "0.1.0", path = "../gp-evidence" }
gp-look = { version = "0.1.0", path = "../gp-look" }
gp-present = { version = "0.1.0", path = "../gp-present" }
gp-interp = { version = "0.1.0", path = "../gp-interp" }
gp-model = { version = "0.1.0", path = "../gp-model" }
gp-sound = { version = "0.1.0", path = "../gp-sound" }
gp-theme = { version = "0.1.0", path = "../gp-theme" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
