[package]
name = "gp-nes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
gp-evidence = { version = "0.1.0", path = "../gp-evidence" }
gp-runtime = { version = "0.1.0", path = "../gp-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tetanes-core = { path = "../../third_party/tetanes-core" }
thiserror = "2.0.21"

[build-dependencies]
blake3 = "1.8.7"

[lints]
workspace = true

[dev-dependencies]
# Micro-benchmarks of the hot paths (benches/, docs/benchmarks.md). Without
# its default plotting and rayon features, to keep the tree small.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# The RGB table the rebuild draws with, to check the emulator draws the
# same (src/video.rs).
gp-present = { version = "0.1.0", path = "../gp-present" }
stats_alloc = "=0.1.10"
tempfile = "3.27.0"

[[bench]]
name = "hot_paths"
harness = false
