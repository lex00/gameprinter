[package]
name = "gp-web-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# gp-package's registry reader in the browser: the same code `gp` checks a
# registry with. Built as a cdylib for wasm32-unknown-unknown with no imports
# (scripts/web/build-page.sh). The page fetches; this module decides.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gp-package = { version = "0.1.0", path = "../gp-package" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# An export needs `#[unsafe(no_mangle)]` and raw pointers.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
