[package]
name = "gp-cli"
description = "The gp command: a thin client over the library crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "gp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
gp-arcade = { version = "0.1.0", path = "../gp-arcade" }
gp-arcade-play = { version = "0.1.0", path = "../gp-arcade-play" }
gp-capture = { version = "0.1.0", path = "../gp-capture" }
gp-assets = { version = "0.1.0", path = "../gp-assets" }
gp-contract = { version = "0.1.0", path = "../gp-contract" }
gp-coverage = { version = "0.1.0", path = "../gp-coverage" }
gp-cycles = { version = "0.1.0", path = "../gp-cycles" }
gp-events = { version = "0.1.0", path = "../gp-events" }
gp-evidence = { version = "0.1.0", path = "../gp-evidence" }
gp-explore = { version = "0.1.0", path = "../gp-explore" }
gp-gaps = { version = "0.1.0", path = "../gp-gaps" }
gp-host = { version = "0.1.0", path = "../gp-host" }
gp-track = { version = "0.1.0", path = "../gp-track" }
gp-validate = { version = "0.1.0", path = "../gp-validate" }
gp-exts = { version = "0.1.0", path = "../gp-exts" }
gp-derive = { version = "0.1.0", path = "../gp-derive" }
gp-extract = { version = "0.1.0", path = "../gp-extract" }
gp-interp = { version = "0.1.0", path = "../gp-interp" }
gp-look = { version = "0.1.0", path = "../gp-look" }
gp-mcp = { version = "0.1.0", path = "../gp-mcp" }
gp-model = { version = "0.1.0", path = "../gp-model" }
gp-theme = { version = "0.1.0", path = "../gp-theme" }
gp-module = { version = "0.1.0", path = "../gp-module" }
gp-nes = { version = "0.1.0", path = "../gp-nes" }
gp-play = { version = "0.1.0", path = "../gp-play" }
gp-package = { version = "0.1.0", path = "../gp-package" }
gp-present = { version = "0.1.0", path = "../gp-present" }
gp-runtime = { version = "0.1.0", path = "../gp-runtime" }
gp-sim = { version = "0.1.0", path = "../gp-sim" }
gp-sound = { version = "0.1.0", path = "../gp-sound" }
gp-sprites = { version = "0.1.0", path = "../gp-sprites" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# The ROM dataset's tables (gp dataset rom), as game-printer wrote them.
parquet = { version = "=60.1.0", default-features = false }
hex = "0.4.3"
md-5 = "0.11.0"
sha1 = "0.11.0"
zip = { version = "=9.1.2", default-features = false, features = ["deflate-flate2"] }
tetanes-core = { path = "../../third_party/tetanes-core" }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
png = "0.18.1"
tempfile = "3.27.0"
toml = "1.1.8"

[dev-dependencies]
# tests/mcp.rs reads and writes the sprite sheets the MCP tools exchange.
gp-imagefmt = { version = "0.1.0", path = "../gp-imagefmt" }

[build-dependencies]
blake3 = "1.8.7"

[lints]
workspace = true
