# State machines.

[[machine]]
byte = 0x05
element = "game"
values = [0, 1, 2, 3]
initial = 0
complete = true
class = "rom"
note = "STATE: 0 playing, 1 dying, 2 clear, 3 game over"

[[transition]]
byte = 0x05
from = 0
to = 1
pc = "C42C"
class = "rom"
note = "kill_player: a slug's touch or the pit"

[[transition]]
byte = 0x05
from = 0
to = 2
pc = "C29F"
class = "rom"
note = "move_player: the goal"

[[transition]]
byte = 0x05
from = 1
to = 0
pc = "C142"
class = "rom"
note = "update_dying -> start_level with a life left"

[[transition]]
byte = 0x05
from = 1
to = 3
pc = "C456"
class = "rom"
note = "update_dying with no life left"

[[transition]]
byte = 0x05
from = 3
to = 0
pc = "C142"
class = "rom"
note = "main's game over -> new_game -> start_level"

[[machine]]
byte = 0x26
bytes = [0x26, 0x27]
element = "slug"
values = [0, 1, 2]
initial = 1
complete = true
class = "rom"
note = "ENEMY_STATE: 0 gone, 1 walking, 2 squashed"

[[transition]]
byte = 0x26
from = 1
to = 2
pc = "C506"
class = "rom"
note = "touch_enemies: a stomp"

[[transition]]
byte = 0x26
from = 2
to = 0
pc = "C46B"
class = "rom"
note = "tick_squashed: the time is up"

[[transition]]
byte = 0x26
from = [0, 2]
to = 1
pc = "C164"
class = "rom"
note = "start_level puts every slug back to walking"
