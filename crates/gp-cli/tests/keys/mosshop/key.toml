# Moss Hop's key (docs/formats/rom-dataset-key.md), brought from game-printer
# (games/keys/mosshop) as gp dataset grade's test fixture: what a dataset of
# target/mosshop/mosshop.nes should say, from templates/mosshop/model.toml,
# templates/mosshop/mapping.toml and the source, games/mosshop/mosshop.s and
# ram.inc. Instruction addresses are the CODE segment's, which starts at
# $C000. Moss Hop is practice: the tool lane may read this key.
#
# Where the code and the model or mapping differ, the code wins:
# - STATE ($05) is both the game's state and the player's in the mapping;
#   here it is the game's only, since one byte belongs to one element.
# - The mapping's [[ignore]] calls TMP_XL ($30) a pointer. The code uses it
#   as the low byte of a pixel column (touch_enemies, cell_at): scratch.
# - The slug's stomp_depth (7) is a model number the code never holds: it
#   compares PLAYER_Y with STOMP_BELOW, 172. The constant at that compare is
#   keyed as 172.
# - Bytes the mapping doesn't map but ram.inc names (TIMER, ENEMY_TIMER,
#   PEAK_Y, the scratch and redraw bytes) are keyed from the source.

[key]
format = "0.1.0"
game = "mosshop"
rom = "44fcedf5050970a0ae6cf10c76ac80d9628f663416c22adb8432a43b0c953ec4"
rom_file = "target/mosshop/mosshop.nes"
model = "templates/mosshop/model.toml"
mapping = "templates/mosshop/mapping.toml"
sources = ["games/mosshop/mosshop.s", "games/mosshop/ram.inc"]

[[element]]
name = "player"
kind = "player"
model = "entities.player"
class = "rom"

[[element]]
name = "slug"
kind = "slots"
slots = 2
model = "entities.slug"
class = "rom"

[[element]]
name = "camera"
kind = "camera"
model = "cameras.main"
class = "rom"

[[element]]
name = "game"
kind = "game"
model = "rules.game"
class = "rom"

[[element]]
name = "counters"
kind = "hud"
model = "counters"
class = "rom"

[[element]]
name = "level"
kind = "level"
model = "levels.main"
class = "rom"

[[element]]
name = "input"
kind = "input"
class = "rom"

