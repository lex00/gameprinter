[package]
name = "gp-extract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Agent extraction (docs/mechanics.md in game-printer): a mechanic's
# parameters measured from a recording's tracks, proposed as model facts
# with evidence, questions for the person where the measurement can't
# decide, and the refinement loop's bookkeeping. Tooling only: measurement
# uses floats, and nothing here runs in a game. Ported in waves: this one
# brings the facts (apply), the questions and propose's path steps, which
# the lockstep loop needs; feel and the rest of propose come with gp-track.
[dependencies]
gp-model = { version = "0.1.0", path = "../gp-model" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[lints]
workspace = true
