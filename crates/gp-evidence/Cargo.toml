[package]
name = "gp-evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
dirs = "7.0.0"
hex = "0.4.3"
# Pinned exactly: trace and event chunks are stored compressed and named by
# hash, so a compressor that wrote different bytes would change recording IDs.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"

[lints]
workspace = true

[dev-dependencies]
stats_alloc = "=0.1.10"
tempfile = "3.27.0"
