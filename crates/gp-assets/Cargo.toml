[package]
name = "gp-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
gp-evidence = { version = "0.1.0", path = "../gp-evidence" }
# Lifted tiles are indexed PNG. Pinned exactly: the lifted files must be the
# same bytes on every platform and every run, and another encoder version
# could compress them differently (docs/assets.md).
png = "=0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[lints]
workspace = true

