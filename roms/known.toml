status = "verified"
evidence = "Published checksums only, weaker than a disassembly rebuild (no disassembly of this game was found, 2026-10-28). NesCartDB (BizHawk Assets/gamedb/NesCarts.xml at commit 2601ad636afa) lists three NES-NG-USA cartridges dumped by bootgod (PRG chip NES-NG-0, CHR NES-NG-0) with PRG and CHR SHA-1 15f245161179ab1959b7dc20e82add024d23aa3d (CRC32 7C4A72D8); GoodNES 3.23's 'Ninja Gaiden (U) [!]' (BizHawk gamedb_goodnes.txt, commit 7c1b40df1f48; TASVideos lists the same for the game) has whole-file SHA-1 ca513f841d75efeb33bb8099fb02beeb39f6bb9c, our ines_sha1, which TASVideos 4751M names too. Both cover CHR."
notes = "An extra game, registered 2026-10-28, from the user's file 'Ninja Gaiden (U).nes': briefly a Milestone 1 target that day, set aside when its NesHawk run desynced at the act 1 boss (game-printer's docs/corpus.md). Board SLROM, 128KB PRG, 128KB CHR, no PRG RAM. NesCartDB's three boards carry an MMC1A, an MMC1B1-H and an MMC1B2; they differ only in the PRG RAM disable bit, which a board without PRG RAM doesn't use."

