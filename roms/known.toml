id = "kirby-usa-prg0"
title = "Kirby's Adventure"
platform = "nes"
board = "NES-TKROM"
submapper = 0
mirroring = "mapper"
battery = true
prg_rom_bytes = 524288
chr_rom_bytes = 262144
prg_ram_bytes = 8192
chr_ram_bytes = 0
board_evidence = "NesCartDB (BizHawk Assets/gamedb/NesCarts.xml at commit 2601ad636afa) lists bootgod's NES-KR-USA dump on an NES-TKROM board (PCB NES-TKROM-10), mapper 4, MMC3C, 512KB PRG, 256KB CHR ROM, 8KB battery-backed PRG RAM (wram battery=1). The MMC3 sets the mirroring. Checked 2026-10-28."
region = "ntsc"
revision = "PRG0"
sha256 = "a6b81fec11c24a33fd763db5c28005e760a1614e70c1bb5ccde0bd4242431000"
md5 = "36ffa102acba11b5c57427d8ac5ad98e"
sha1 = "32473799f96406d73aa37d5cf66e0e27f1f339da"
ines_sha1 = "e099d688760ff0ce114ca8a9fd083e31e41cfade"
mapper = 4
status = "verified"
evidence = "Published checksums only, weaker than a disassembly rebuild (none rebuilds this revision: Nathan-R-Og/kirbyadventure is a work in progress on Rev A that splits binaries from the user's ROM). Checked 2026-10-27: NesCartDB (BizHawk Assets/gamedb/NesCarts.xml at commit 2601ad636afa) lists NES-KR-USA without a revision, PRG chip NES-KR-0, dumped by bootgod (2005-12-14) and TheRedEye (a prototype board, 2012-04-23), PRG and CHR SHA-1 32473799f96406d73aa37d5cf66e0e27f1f339da (CRC32 D7794AFC); GoodNES 3.23's 'Kirby's Adventure (U) (PRG0) [!]', as TASVideos lists it for game version 559 (tasvideos.org/api/v1/games/41) and BizHawk's gamedb_goodnes.txt (commit 7c1b40df1f48), has whole-file SHA-1 e099d688760ff0ce114ca8a9fd083e31e41cfade, our ines_sha1. Both cover CHR."
notes = "The Milestone 1 Kirby's Adventure target, from the user's file 'Kirby's Adventure (U) (PRG 0).nes', added 2026-10-27. The later USA revision (NesCartDB revision A, PRG chip NES-KR-1, CRC32 5ED6F221, SHA-1 118307da6c77a592f0884baad14120301d8d3a1b; GoodNES '(U) (PRG1) [!]') has the same CHR and a different PRG, and is a separate source. Board TKROM, MMC3C, 8KB battery-backed PRG RAM. The file's header bytes 10 to 15 hold dumper text ('Ni0330'), so its file SHA-1 (6bb9ac9f3a25bc4f) differs from ines_sha1; the headerless hashes are unaffected. TASVideos 3226M was made on this revision."

