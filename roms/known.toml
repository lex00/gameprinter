# NES ROM entries brought from game-printer's sources/nes.toml for games
# that have no folder in the games checkout yet: hashes and facts only,
# never the games themselves. The six are the ROMs the owner had that
# game-printer registered and gameprinter has no package for (Kirby's
# Adventure, Ninja Gaiden, Gauntlet, Gauntlet II, Q*bert, Track & Field).
#
# Nothing names a ROM by these entries: `gp roms scan` and `gp game new`
# read the games checkout's roms.toml files, so these ROMs still show as
# unknown, and a game can be started from one. `gp game new` copies the
# matching entry here (its board facts, hashes, evidence and notes) into
# the new game's roms.toml, with the new game's source id, instead of
# drafting one from the header. gp-nes's compiled-in list (roms/nes.toml)
# stays empty: a game's board facts live with the game. The ROM-blocking
# hook reads this file too (.githooks/guarded-roms.toml lists the same
# hashes).
#
# `sha256` is the SHA-256 of PRG and CHR data with the iNES header (and any
# trainer) removed, as `gp roms scan` prints it. `status` is `unverified`
# until the hash is checked against an independent reference
# (docs/sources.md). The board facts (`board` to `board_evidence`) are what
# the header would otherwise say. `md5`, `sha1` and `ines_sha1` are what
# FCEUX and BizHawk movies name a ROM by (docs/movies.md).

