# ld65 layout for Moss Hop on MMC3 (mapper 4): 64KB of PRG in eight 8KB
# banks, bank 2 switched in at $8000 by register 6 and banks 6 and 7 fixed
# at $C000 and $E000, then 8KB of CHR ROM. Segment BANK2 is bank 2.
MEMORY {
    HEADER: start = $0000, size = $0010, file = %O, fill = yes, fillval = $00;
    PRG0:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG2:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG3:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG4:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG5:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG:    start = $C000, size = $4000, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:  load = HEADER, type = ro;
    BANK2:   load = PRG2,   type = ro;
    CODE:    load = PRG,    type = ro;
    RODATA:  load = PRG,    type = ro;
    VECTORS: load = PRG,    type = ro, start = $FFFA;
    CHARS:   load = CHR,    type = ro;
}
