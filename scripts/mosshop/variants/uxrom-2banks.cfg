# ld65 layout for Moss Hop on UxROM (mapper 2): 64KB of PRG in four 16KB
# banks, banks 0 to 2 switched in at $8000 and bank 3 fixed at $C000, then
# 8KB of CHR ROM. Segments BANK1 and BANK2 are banks 1 and 2.
MEMORY {
    HEADER: start = $0000, size = $0010, file = %O, fill = yes, fillval = $00;
    PRG0:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG2:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG:    start = $C000, size = $4000, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:  load = HEADER, type = ro;
    BANK1:   load = PRG1,   type = ro;
    BANK2:   load = PRG2,   type = ro;
    CODE:    load = PRG,    type = ro;
    RODATA:  load = PRG,    type = ro;
    VECTORS: load = PRG,    type = ro, start = $FFFA;
    CHARS:   load = CHR,    type = ro;
}
