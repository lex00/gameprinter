# The licences a released gp may carry (scripts/release/build.sh runs
# cargo-about with this). Every crate in gp's tree today is under one of
# these; a new crate under another fails the release until it is looked at.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
]
private = { ignore = true }
