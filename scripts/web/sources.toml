# The registries a page can be built for: `GP_PAGE_SOURCE=NAME`. A page holds
# one source's address and, if it's signed, its root public key. A url of "." is the page's own
# address: `gp registry serve` serves the page and a folder registry together.
[staging]
name = "gp-staging"
url = "https://gp-staging-354867293429.s3.us-east-2.amazonaws.com"
root = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEoXL5YfJ6rWdggoGhTubKRNnHfvNOByMUTPuIJshfGH root@gp-staging"

# A registry in a folder on this machine, signed with the staging keys.
[local]
name = "gp-local"
url = "."
root = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEoXL5YfJ6rWdggoGhTubKRNnHfvNOByMUTPuIJshfGH root@gp-staging"

# The public repo lex00/gp-registry. It has no root key, so the page doesn't
# look at signatures or expiries for it. Signing is opt-in: give a source a
# root and the page requires them. See docs/registry-backends.md.
[registry]
name = "gp-registry"
url = "https://raw.githubusercontent.com/lex00/gp-registry/main"
