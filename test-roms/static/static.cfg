# UxROM (mapper 2), four 16KB banks: data in banks 0 to 2, every routine in
# the fixed last bank at $C000.
MEMORY {
    HEADER: start = $0000, size = $0010, fill = yes, file = %O;
    BANK0:  start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    BANK1:  start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    BANK2:  start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    FIXED:  start = $C000, size = $4000, fill = yes, fillval = $FF, file = %O;
    CHR:    start = $0000, size = $2000, fill = yes, file = %O;
}
SEGMENTS {
    HEADER:  load = HEADER, type = ro;
    BANK0:   load = BANK0, type = ro;
    CODE:    load = FIXED, type = ro;
    RODATA:  load = FIXED, type = ro;
    VECTORS: load = FIXED, type = ro, start = $FFFA;
}
