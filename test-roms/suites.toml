# The standard NES test ROMs that `gp testroms` runs (docs/test-roms.md).
#
# The ROMs are never committed: their licenses vary, and the pre-commit hook
# refuses NES images anyway. `gp testroms fetch` (and `run`, for anything
# missing) downloads each file from raw.githubusercontent.com at the pinned
# commit below into $GP_HOME/work/test-roms/, and refuses any whose SHA-256
# isn't the one listed here.
#
# `check` is how a suite reports: `nestest` compares the CPU against
# nestest.log, `blargg` reads the status byte and text at $6000,
# `blargg-2005` reads the result code at $F8, `blargg-2005-screen` reads the
# result code that blargg's 2005 PPU and APU tests print (`$01`), and
# `screen` reads "Passed" or "Failed" off the screen, for a board with no RAM
# at $6000. `frames` is the most frames a ROM may run before it counts as
# timed out: at least twice what the slowest ROM in the suite took on
# 2026-10-27, and up to 20 times for the quick suites.
#
# `region = "pal"` powers a suite on as a PAL console (NTSC otherwise), and
# `mmc3_revision` picks the MMC3 revision a ROM tests. `needs_zeroed_ram`
# marks a suite whose expected output was made with RAM powered on as zeros,
# which `gp testroms run --ram-ones` skips.
#
# `built_from` marks a test program of our own: its source is in the repo,
# `just build-testroms` assembles it into $GP_HOME/work/test-roms/gp/, and
# it's never downloaded. Its SHA-256 pins the build, so a change to the
# source or the assembler shows up as a wrong hash.
#
# docs/test-roms.md lists the collection's other directories and why each
# isn't run.
#
# `known_failure` marks a ROM that fails today, with the open question that
# tracks it, and `known_result` is how its result starts when it fails that
# way (such as "code 2:"). Only that failure is excused: any other result,
# a timeout included, fails the run, and so does a known failure that starts
# passing, so this list only ever shrinks on purpose.

[source]
repo = "christopherpow/nes-test-roms"
commit = "95d8f621ae55cee0d09b91519a8989ae0e64753b"

[[suite]]
name = "nestest"
check = "nestest"
about = "CPU: every instruction, official and unofficial, checked against a known-good log (nestest.log) in automation mode"
log = { path = "other/nestest.log", sha256 = "442c4dd5539c7e88b3fd73c7b732a7eadbd22b47c2cd9e58397ef147f64f6f8f" }
# nestest.log shows memory as a run with RAM powered on as zeros left it
# ("STX $00 = 00"), so a --ram-ones run can't be compared with it.
needs_zeroed_ram = true

[[suite.rom]]
path = "other/nestest.nes"
sha256 = "f67d55fd6b3cf0bad1cc85f1df0d739c65b53e79cecb7fea8f77ec0eadab0004"

