# ld65 config for test-roms/mmc1/mmc1.s: an iNES header, 16 PRG banks of
# 16KB, each linked at $C000 (where its reset stub runs), and 128KB of CHR.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw;
    RAM:    start = $0300, size = $0500, type = rw;
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG0: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG2: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG3: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG4: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG5: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG6: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG7: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG8: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG9: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG10: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG11: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG12: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG13: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG14: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG15: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $20000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    HEADER:   load = HEADER, type = ro;
    BANK0: load = PRG0, type = ro;
    BANK1: load = PRG1, type = ro;
    BANK2: load = PRG2, type = ro;
    BANK3: load = PRG3, type = ro;
    BANK4: load = PRG4, type = ro;
    BANK5: load = PRG5, type = ro;
    BANK6: load = PRG6, type = ro;
    BANK7: load = PRG7, type = ro;
    BANK8: load = PRG8, type = ro;
    BANK9: load = PRG9, type = ro;
    BANK10: load = PRG10, type = ro;
    BANK11: load = PRG11, type = ro;
    BANK12: load = PRG12, type = ro;
    BANK13: load = PRG13, type = ro;
    BANK14: load = PRG14, type = ro;
    BANK15:   load = PRG15, type = ro;
    CODE:     load = PRG15, type = ro;
    RAMCODE:  load = PRG15, run = RAM, type = rw, define = yes;
    STUB15:   load = PRG15, type = ro, start = $FFEA;
    CHR:      load = CHR, type = ro;
}
