# ld65 config for test-roms/mmc3/mmc3.s: an iNES header, 16 PRG banks of
# 8KB (all code is in the last, which MMC3 fixes at $E000), and 128KB of CHR.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw;
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG0:   start = $8000, size = $1E000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG15:  start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $20000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    HEADER:   load = HEADER, type = ro;
    BANKS:    load = PRG0, type = ro;
    CODE:     load = PRG15, type = ro;
    VECTORS:  load = PRG15, type = ro, start = $FFFA;
    CHR:      load = CHR, type = ro;
}
