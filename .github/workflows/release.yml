name: release
# Builds gp release archives (scripts/release/build.sh, docs: site/src/content/docs/install.md)
# on each platform's own runner, and keeps them as this run's artifacts.
#
# NOT ENABLED TO PUBLISH. It runs only when someone starts it by hand
# (Actions, release, Run workflow). It makes no GitHub release, pushes no
# tag and uploads nothing outside the run. Turning it on for tags is the
# owner's call: uncomment the `push: tags` lines, and add a job that makes
# the release from the artifacts (gh release create, with `contents: write`).
# It needs no secrets. Signing and notarizing the macOS builds would need the
# owner's Apple developer secrets; see install.md, "What a Mac says".
on:
  workflow_dispatch:
  # push:
  #   tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          # macos-13 is retired; macos-15-intel is GitHub's Intel Mac now.
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # Git Bash runs the scripts; MSVC's linker is on the runner. The
          # archive is a .zip with gp.exe in it.
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    # Every step in bash, Git Bash on Windows, so build.sh runs as it is.
    defaults:
      run:
        shell: bash
    steps:
      # Windows checks out with CRLF line ends by default, which would put
      # CRLF in the files gp carries and in the shell scripts.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Tools
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown ${{ matrix.target }}
          cargo install --locked cargo-about --version 0.9.2
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get -o Acquire::Retries=5 update -qq
            sudo apt-get -o Acquire::Retries=5 install -y -qq zip
          fi
      - name: Editor
        working-directory: editor
        run: npm ci --silent --no-audit --no-fund && npm run --silent build
      # The runner has no page that passed the release check, so this gp
      # carries none; gp theme look play then needs --page. The owner's
      # local `just release` carries the page.
      - name: Build
        env:
          GP_RELEASE_TARGET: ${{ matrix.target }}
          GP_HOME: ${{ runner.temp }}/gp-home
        run: scripts/release/build.sh "$RUNNER_TEMP/release" --target ${{ matrix.target }}
      # Its own build, unpacked from the archive as a person would, run in
      # an empty home with the checkout out of reach.
      - name: Try it outside the checkout
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then tmp="$(cygpath -u "$tmp")"; fi
          mkdir -p "$tmp/unpacked" "$tmp/empty-home"
          cd "$tmp/unpacked"
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -bso0 "$tmp"/release/gp-*.zip
            gp="$(ls -d "$tmp"/unpacked/gp-*/)gp.exe"
            USERPROFILE="$(cygpath -w "$tmp/empty-home")"
            export USERPROFILE
          else
            tar -xzf "$tmp"/release/gp-*.tar.gz
            gp="$(ls -d "$tmp"/unpacked/gp-*/)gp"
          fi
          cd "$tmp"
          export HOME="$tmp/empty-home" GP_HOME="$tmp/empty-home/.gameprinter"
          "$gp" --version
          "$gp" self check
      - uses: actions/upload-artifact@v4
        with:
          name: gp-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.sha256
          if-no-files-found: error
