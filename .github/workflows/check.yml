name: check
on:
  push:
  pull_request:
jobs:
  check:
    # Hosted, so it holds no ROM. Everything here runs on Moss Hop, built from source.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cc65 just
          rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: just setup
      - run: just check
