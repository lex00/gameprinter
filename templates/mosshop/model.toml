[model]
schema = "0.4"
name = "mosshop"
title = "Moss Hop"
description = "The reference game (games/mosshop/, docs/reference-game.md), written by hand from its source and checked against its baselines."
source = "mosshop"
view = "side"
frame_rate = "39375000/655171"
systems = ["rules", "entity_states", "counters", "spawn", "platformer.player", "platformer.enemies", "platformer.contact", "exits", "camera"]
events = ["block.coin", "coin.touched", "player.fell"]

[model.extensions]
platformer = "0.4"

[input]
device = "nes-pad"

[input.actions]
jump = "a"
left = "left"
right = "right"
run = "b"

[assets.font]
kind = "font"
role = "font"
description = "The digits from tile $30 and the cross, which the counters are drawn with"

[assets.font.from]
source = "mosshop"
asset = "tiles"

[assets.level]
kind = "level-grid"
role = "layout"

[assets.level.from]
source = "mosshop"
asset = "level"

[assets.metatiles]
kind = "metatiles"
role = "tileset"
description = "Sky, moss over soil, soil, stone block, the burrow's two halves, the ? block, the used block it becomes, and a coin"
item_roles = ["sky", "terrain", "terrain", "terrain", "goal", "goal", "interactive", "terrain", "collectible"]

[assets.metatiles.from]
source = "mosshop"
asset = "metatiles"

[assets.palettes]
kind = "palettes"
role = "palettes"
description = "Four background palettes, then four sprite palettes"
item_roles = ["terrain", "terrain", "terrain", "terrain", "player", "enemy", "player", "player"]

[assets.palettes.from]
source = "mosshop"
asset = "palettes"

[assets.slugs]
kind = "table"
role = "spawns"
description = "Each slug's patrol: start and end"

[assets.slugs.from]
source = "mosshop"
asset = "slugs"

[assets.tiles]
kind = "tiles"
role = "graphics"
description = "The whole pattern table; tiles $00 to $27 and $30 to $3C are drawn"

[assets.tiles.from]
source = "mosshop"
asset = "tiles"

[entities.player]
description = "A round moss creature"
role = "player"
size = [16, 16]
tile_collision = true

[entities.player.hitbox]
h = 16
w = 12
x = 2
y = 0

[entities.player.jump]
action = "jump"
gravity = "0.25"
max_fall = 4
speed = -5

[entities.player.jump.head]
point = [8, 0]

[[entities.player.jump.head.hits]]
becomes = "solid"
event = "block.coin"
speed = 0
tile = "coin_block"

[entities.player.jump.pickup]
becomes = "empty"
event = "coin.touched"
points = [[8, 8]]
tile = "coin"

[entities.player.machine]
initial = "normal"

[entities.player.machine.states.dying]
description = "kill_player sets PLAYER_VY to -4 and update_dying moves the player by gravity alone, through every tile, with no input. draw_sprites turns it upside down (the vertical flip, which swaps its top and bottom tiles)"
enter_speed = [0, -4]
ground = "leave"

[entities.player.machine.states.dying.set]
tile_collision = false

[entities.player.machine.states.dying.set.run]
off = true

[entities.player.machine.states.dying.set.sprite]
flip_when_facing_left = true
front = true
palette = 4
slot = "tiles"
tiles = [18, 19, 16, 17]
width = 2

[[entities.player.machine.states.dying.set.sprite.cells]]
flip_y = true

[[entities.player.machine.states.dying.set.sprite.cells]]
flip_y = true

[[entities.player.machine.states.dying.set.sprite.cells]]
flip_y = true

[[entities.player.machine.states.dying.set.sprite.cells]]
flip_y = true

[[entities.player.machine.states.normal.transition]]
on = "player.died"
to = "dying"

[entities.player.run]
air_control = true
run_action = "run"
run_speed = 2
walk_speed = 1

[entities.player.sprite]
flip_when_facing_left = true
front = true
palette = 4
slot = "tiles"
tiles = [16, 17, 18, 19]
width = 2

[entities.slug]
role = "enemy"
size = [16, 16]

[entities.slug.contact]
bounce = -3
keep_on_stomp = true
otherwise = "kill-player"
stomp_depth = 7

[entities.slug.hitbox]
h = 12
w = 12
x = 2
y = 4

[entities.slug.machine]
initial = "walking"

[entities.slug.machine.states.flat]
description = "Squashed: flat on the ground for 30 frames (ENEMY_TIMER), touching nothing, then gone"

[entities.slug.machine.states.flat.set.contact]
otherwise = "nothing"
stomp_depth = 0

[entities.slug.machine.states.flat.set.patrol]
period = 2
step = 0

[entities.slug.machine.states.flat.set.sprite]
flip_when_facing_left = true
palette = 5
slot = "tiles"
tiles = [36, 37, 38, 39]
width = 2

[[entities.slug.machine.states.flat.transition]]
after = 30
do = ["remove"]
to = "flat"

[[entities.slug.machine.states.walking.transition]]
on = "enemy.stomped"
to = "flat"

[entities.slug.patrol]
period = 2
step = 1

[entities.slug.sprite]
flip_when_facing_left = true
palette = 5
slot = "tiles"
tiles = [20, 21, 22, 23]
width = 2

[levels.main]
description = "Two screens wide, ending at the burrow, with a ? block and five coins"
grid = "level"
kill_below = 208
kind_property = "kind"
pit_event = "player.fell"
size = [32, 15]
solid_property = "solid"
tile_size = 16
tileset = "metatiles"

[levels.main.goal]
x = 468

[[levels.main.spawn]]
entity = "player"
x = 24
y = 176

[[levels.main.spawn]]
entity = "slug"
table = "slugs"
y = 176

[levels.main.spawn.columns]
patrol_end = "end"
x = "start"

[levels.main.tile_kinds]
2 = "coin_block"
5 = "coin"

[cameras.main]
follow = "player"
axis = "x"
size = [256, 240]
lead = [120, 0]
clamp_to_level = true

[rules.game]
initial = "playing"

[rules.game.states.clear]
description = "The level is clear: the player is in the burrow's doorway and everything stays where it is"
freeze = true

[rules.game.states.dying]
description = "The player is drawn upside down and hops off the screen (its machine's dying state) while the slugs, their touches and the camera stop"
stops = ["platformer.enemies", "platformer.contact", "camera"]

[[rules.game.states.dying.transition]]
to = "playing"
after = 90
do = ["change:lives:-1", "restart-level"]

[rules.game.states.dying.transition.if]
counter = "lives"
cmp = ">="
value = 1

[[rules.game.states.dying.transition]]
to = "game_over"
after = 90

[rules.game.states.game_over]
description = "Nothing moves, and the game starts again 120 frames later. update_dying spends the frame the time runs out without moving the player, so the freeze stops the player at once"
freeze = true
stops_at_once = ["platformer.player"]

[[rules.game.states.game_over.transition]]
to = "playing"
after = 120
do = ["reset-game"]

[[rules.game.states.playing.transition]]
to = "dying"
on = "player.died"

[[rules.game.states.playing.transition]]
to = "playing"
on = "player.fell"
do = ["kill-player"]

[[rules.game.states.playing.transition]]
to = "clear"
on = "goal.reached"

[[counters.coins.change]]
on = "block.coin"

[[counters.coins.change]]
on = "coin.touched"

[[counters.deaths.change]]
on = "player.died"

[counters.lives]
start = 2
min = 0

[[counters.stomps.change]]
on = "enemy.stomped"

[present.hud]
tiles = "tiles"
font = "font"

[[present.hud.field]]
at = [3, 2]
counter = "coins"
digits = 2
sprite = true

[[present.hud.field]]
at = [27, 2]
counter = "lives"
digits = 2
sprite = true

[[present.hud.sprite]]
at = [16, 16]
tiles = "tiles"
tile = 58

[[present.hud.sprite]]
at = [200, 16]
tiles = "tiles"
tile = 60

[[present.hud.sprite]]
at = [208, 16]
tiles = "tiles"
tile = 59

[present.cells.kinds]
empty = 0
solid = 7

