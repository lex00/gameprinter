# Swing State: the assets of an original template, written by hand
# (docs/originals.md). `gp template build` lays them out in a data image
# and writes assets/swing-state.toml; levels are one character per 16x16 cell.
format = "0.1.0"
source = "swing-state"
title = "Swing State"

# Generated at build time: each tile shows its number (CC0-1.0).
[[asset]]
name = "tiles"
format = "chr-2bpp"
tiles = 256
generate = "stub"

# Background: the stage, the bunting, banners, the podium. Sprites: the
# candidate, the opposition, the press, money.
[[asset]]
name = "palettes"
format = "palette"
palettes = [
  [0x0F, 0x01, 0x11, 0x30],
  [0x0F, 0x16, 0x30, 0x12],
  [0x0F, 0x06, 0x16, 0x30],
  [0x0F, 0x07, 0x17, 0x28],
  [0x0F, 0x0F, 0x12, 0x37],
  [0x0F, 0x0F, 0x16, 0x36],
  [0x0F, 0x0F, 0x00, 0x30],
  [0x0F, 0x0F, 0x1A, 0x2A],
]

[[asset]]
name = "metatiles"
format = "metatiles"
properties = ["solid"]
metatile = [
  { name = "night sky", char = ".", tiles = [0x00, 0x00, 0x00, 0x00], solid = 0 },
  { name = "stage floor", char = "#", tiles = [0x01, 0x02, 0x03, 0x04], solid = 1 },
  { name = "bunting", char = "=", tiles = [0x05, 0x06, 0x07, 0x08], solid = 1 },
  { name = "lectern", char = "H", tiles = [0x09, 0x0A, 0x0B, 0x0C], solid = 1 },
  { name = "crowd barrier", char = "U", tiles = [0x0D, 0x0E, 0x0D, 0x0E], solid = 1 },
  { name = "campaign banner", char = "~", tiles = [0x10, 0x11, 0x12, 0x13], solid = 0 },
  { name = "victory podium, left", char = "[", tiles = [0x14, 0x15, 0x16, 0x17], solid = 0 },
  { name = "victory podium, right", char = "]", tiles = [0x18, 0x19, 0x1A, 0x1B], solid = 0 },
]

# Each pollster walks from start to end and back (pixels in the level),
# one table per level.
[[asset]]
name = "pollsters_town_hall"
format = "table"
columns = ["start", "end"]
rows = [[384, 448]]

[[asset]]
name = "pollsters_debate_stage"
format = "table"
columns = ["start", "end"]
rows = [[368, 480], [832, 864]]

[[asset]]
name = "pollsters_election_night"
format = "table"
columns = ["start", "end"]
rows = [[688, 768]]

