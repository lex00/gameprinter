[model]
schema = "0.4.0"
name = "swing_state"
title = "Swing State"
description = "An original: a campaign as a platformer. The candidate runs the trail from a town hall to election night, stomping hecklers, dodging attack ads and pundits who rise from their lecterns, and taking donations on the way. Its mechanics are composed from Super Mario Bros.' movement, paratroopas, piranha plants and bullet bills and Moss Hop's patrolling slugs, rescaled to the candidate (docs/originals.md)"
source = "swing-state"
view = "side"
frame_rate = "60"
systems = ["rules", "entity_states", "counters", "spawn", "platformer.player", "platformer.enemies", "platformer.contact", "exits", "camera"]
start_level = "town_hall"

[model.extensions]
platformer = "0.4.0"

[input]
device = "nes-pad"

[input.actions]
jump = "a"
left = "left"
right = "right"
run = "b"

[assets.debate_stage]
kind = "level-grid"
role = "layout"

