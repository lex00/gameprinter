[rules.game]
initial = "campaigning"

[[rules.game.states.campaigning.transition]]
to = "news_cycle"
on = "player.died"
do = ["change:approval:-1"]

[[rules.game.states.campaigning.transition]]
to = "news_cycle"
on = "days.reached_min"
do = ["change:approval:-1"]

[[rules.game.states.campaigning.transition]]
to = "elected"
on = "goal.reached"

[rules.game.states.campaigning.transition.if]
counter = "stops"
cmp = ">="
value = 3

[[rules.game.states.campaigning.transition]]
to = "rally"
on = "goal.reached"

[rules.game.states.conceded]
description = "Approval at zero: the game is over"
freeze = true

[rules.game.states.elected]
description = "The last podium: the game is won"
freeze = true

[rules.game.states.news_cycle]
description = "A gaffe: the story runs for a moment, then the stop starts again"
freeze = true

[[rules.game.states.news_cycle.transition]]
to = "campaigning"
after = 90
do = ["restart-level"]

[rules.game.states.news_cycle.transition.if]
counter = "approval"
cmp = ">"
value = 0

[[rules.game.states.news_cycle.transition]]
to = "conceded"
after = 90

[rules.game.states.rally]
description = "A stop won; the bus to the next one"
freeze = true

[[rules.game.states.rally.transition]]
to = "campaigning"
after = 60
do = ["next-level"]

[counters.approval]
description = "Lives"
start = 3
min = 0

[counters.days]
description = "Days left until the vote, one every 60 frames"
min = 0

[[counters.days.change]]
every = 60
by = -1

[counters.donations]
max = 999

[[counters.donations.change]]
on = "item.collected"

[[counters.rebuttals.change]]
on = "enemy.stomped"

[[counters.stops.change]]
on = "goal.reached"

