description = "Night sky, stage floor, bunting, lectern, crowd barrier, banner, and the victory podium's two halves"
item_roles = ["sky", "terrain", "platform", "terrain", "terrain", "background", "goal", "goal"]

[assets.metatiles.from]
source = "swing-state"
asset = "metatiles"

[assets.palettes]
