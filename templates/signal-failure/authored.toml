# Signal Failure: the assets of an original template, written by hand
# (docs/originals.md). `gp template build` lays them out in a data image
# and writes assets/signal-failure.toml; levels are one character per 16x16
# cell.
format = "0.1.0"
source = "signal-failure"
title = "Signal Failure"

# Generated at build time: each tile shows its number (CC0-1.0).
[[asset]]
name = "tiles"
format = "chr-2bpp"
tiles = 256
generate = "stub"

# Background: platform concrete, tiles, signage, the train. Sprites: the
# commuter, staff, pigeons, paper.
[[asset]]
name = "palettes"
format = "palette"
palettes = [
  [0x0F, 0x00, 0x10, 0x2D],
  [0x0F, 0x08, 0x28, 0x38],
  [0x0F, 0x02, 0x12, 0x30],
  [0x0F, 0x06, 0x16, 0x30],
  [0x0F, 0x0F, 0x11, 0x36],
  [0x0F, 0x0F, 0x02, 0x38],
  [0x0F, 0x0F, 0x00, 0x10],
  [0x0F, 0x0F, 0x28, 0x30],
]

[[asset]]
name = "metatiles"
format = "metatiles"
properties = ["solid"]
metatile = [
  { name = "tunnel dark", char = ".", tiles = [0x00, 0x00, 0x00, 0x00], solid = 0 },
  { name = "platform edge", char = "#", tiles = [0x01, 0x02, 0x03, 0x04], solid = 1 },
  { name = "bench", char = "=", tiles = [0x05, 0x06, 0x07, 0x08], solid = 1 },
  { name = "ticket barrier", char = "T", tiles = [0x09, 0x0A, 0x0B, 0x0C], solid = 1 },
  { name = "stairs", char = "S", tiles = [0x0D, 0x0E, 0x0F, 0x10], solid = 1 },
  { name = "departure board", char = "~", tiles = [0x11, 0x12, 0x13, 0x14], solid = 0 },
  { name = "train door, left", char = "[", tiles = [0x15, 0x16, 0x17, 0x18], solid = 0 },
  { name = "train door, right", char = "]", tiles = [0x19, 0x1A, 0x1B, 0x1C], solid = 0 },
]

