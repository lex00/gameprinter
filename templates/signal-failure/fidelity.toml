[contract]
schema = "0.2.0"
model = "signal_failure"
default = "metric"
description = "Signal Failure as written: its platforms and rules exact to its own model baselines, its movement within tolerances of its own, the look free"

[[rule]]
path = "levels"
level = "structural"
note = "Same platforms, tracks, spawns and train doors"

[[rule]]
path = "rules"
level = "exact"

[[rule]]
path = "counters"
level = "exact"

[[rule]]
path = "entities.commuter.jump"
level = "metric"

[rule.tolerance]
airtime = 2
height = "5%"

[[rule]]
path = "entities[role=enemy]"
level = "metric"

[rule.tolerance]
speed = "3%"

[[rule]]
path = "assets"
level = "style"

[[rule]]
path = "entities[*].sprite"
level = "style"
