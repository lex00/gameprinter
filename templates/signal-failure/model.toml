[rules.game]
initial = "commuting"

[[rules.game.states.commuting.transition]]
to = "delayed"
on = "player.died"
do = ["change:patience:-1"]

[[rules.game.states.commuting.transition]]
to = "delayed"
on = "departure.reached_min"
do = ["change:patience:-1"]

[[rules.game.states.commuting.transition]]
to = "home"
on = "goal.reached"

[rules.game.states.commuting.transition.if]
counter = "trains"
cmp = ">="
value = 3

[[rules.game.states.commuting.transition]]
to = "on_board"
on = "goal.reached"

[rules.game.states.delayed]
description = "Missed it: the next one is in a moment"
freeze = true

[[rules.game.states.delayed.transition]]
to = "commuting"
after = 90
do = ["restart-level"]

[rules.game.states.delayed.transition.if]
counter = "patience"
cmp = ">"
value = 0

[[rules.game.states.delayed.transition]]
to = "working_from_home"
after = 90

[rules.game.states.home]
description = "Made the last train: the game is won"
freeze = true

[rules.game.states.on_board]
description = "On the train; the next platform"
freeze = true

[[rules.game.states.on_board.transition]]
to = "commuting"
after = 60
do = ["next-level"]

[rules.game.states.working_from_home]
description = "Out of patience: the game is over"
freeze = true

[counters.departure]
description = "Seconds until the doors close, one every 60 frames"
min = 0

[[counters.departure.change]]
every = 60
by = -1

[counters.papers]
max = 99

[[counters.papers.change]]
on = "item.collected"

[counters.patience]
description = "Lives"
start = 3
min = 0

[[counters.trains.change]]
on = "goal.reached"

