[model]
schema = "0.4.0"
name = "signal_failure"
title = "Signal Failure"
description = "An original: the commute as a platformer. Make the train before it leaves, over the tracks and through the barriers, past fare inspectors, pigeons, delay announcements and doors that close on their own schedule. Its movement is its own, with coyote time and a jump buffer, and has no source (docs/originals.md)"
source = "signal-failure"
view = "side"
frame_rate = "60"
systems = ["rules", "entity_states", "counters", "spawn", "platformer.player", "platformer.enemies", "platformer.contact", "exits", "camera"]
start_level = "platform_9"

[model.extensions]
platformer = "0.4.0"

[input]
device = "nes-pad"

[input.actions]
jump = "a"
left = "left"
right = "right"
run = "b"

[assets.interchange]
kind = "level-grid"
role = "layout"

[assets.interchange.from]
source = "signal-failure"
asset = "interchange"

[assets.last_train]
kind = "level-grid"
role = "layout"

[assets.last_train.from]
source = "signal-failure"
asset = "last_train"

[assets.metatiles]
kind = "metatiles"
role = "tileset"
description = "Tunnel dark, platform edge, bench, ticket barrier, stairs, departure board, and the train door's two halves"
item_roles = ["background", "terrain", "platform", "terrain", "terrain", "background", "goal", "goal"]

[assets.metatiles.from]
source = "signal-failure"
asset = "metatiles"

[assets.palettes]
kind = "palettes"
role = "palettes"
item_roles = ["terrain", "terrain", "background", "goal", "player", "enemy", "enemy", "collectible"]

[assets.palettes.from]
source = "signal-failure"
asset = "palettes"

[assets.platform_9]
