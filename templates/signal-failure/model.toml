[entities.closing_doors]
description = "Platform screen doors that shut and open again on a timer of their own. They can't be stomped"
role = "hazard"
size = [16, 32]

[entities.closing_doors.contact]
otherwise = "kill-player"

[entities.closing_doors.hitbox]
h = 32
w = 12
x = 2
y = 0

[entities.closing_doors.path]
axis = "y"
distance = 48
pause = 40
speed = 1

[entities.closing_doors.sprite]
palette = 6
slot = "tiles"
tiles = [70, 71, 86, 87, 102, 103, 118, 119]
width = 2

[entities.commuter]
description = "A commuter with a coffee and a phone at four percent"
role = "player"
size = [16, 16]
tile_collision = true

[entities.commuter.hitbox]
h = 14
w = 10
x = 3
y = 2

[entities.commuter.jump]
action = "jump"
buffer_frames = 6
coyote_frames = 6
gravity = "0.25"
gravity_held = "0.15625"
max_fall = 4
speed = "-4.5"

[entities.commuter.run]
acceleration = "0.0625"
air_control = true
deceleration = "0.125"
run_action = "run"
run_speed = 2
walk_speed = "1.25"

[entities.commuter.sprite]
