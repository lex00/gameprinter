# Badge In: the assets of an original template, written by hand
# (docs/originals.md). `gp template build` lays them out in a data image
# and writes assets/badge-in.toml; levels are one character per 16x16 cell.
format = "0.1.0"
source = "badge-in"
title = "Badge In"

# Generated at build time: each tile shows its number (CC0-1.0).
[[asset]]
name = "tiles"
format = "chr-2bpp"
tiles = 256
generate = "stub"

# Four background palettes (carpet, desks, windows, the badge reader),
# then four sprite palettes (the associate, management, office
# equipment, coffee).
[[asset]]
name = "palettes"
format = "palette"
palettes = [
  [0x31, 0x07, 0x17, 0x27],
  [0x31, 0x08, 0x18, 0x38],
  [0x31, 0x01, 0x21, 0x30],
  [0x31, 0x0B, 0x1B, 0x2A],
  [0x31, 0x0F, 0x2A, 0x36],
  [0x31, 0x0F, 0x02, 0x26],
  [0x31, 0x0F, 0x00, 0x10],
  [0x31, 0x0F, 0x17, 0x38],
]

[[asset]]
name = "metatiles"
format = "metatiles"
properties = ["solid"]
metatile = [
  { name = "air", char = ".", tiles = [0x00, 0x00, 0x00, 0x00], solid = 0 },
  { name = "carpet over concrete", char = "#", tiles = [0x01, 0x02, 0x03, 0x04], solid = 1 },
  { name = "desk", char = "=", tiles = [0x05, 0x06, 0x07, 0x08], solid = 1 },
  { name = "cubicle wall", char = "|", tiles = [0x09, 0x0A, 0x09, 0x0A], solid = 1 },
  { name = "filing cabinet", char = "X", tiles = [0x0B, 0x0C, 0x0D, 0x0E], solid = 1 },
  { name = "window", char = "~", tiles = [0x10, 0x11, 0x12, 0x13], solid = 0 },
  { name = "badge reader, left", char = "[", tiles = [0x14, 0x15, 0x16, 0x17], solid = 0 },
  { name = "badge reader, right", char = "]", tiles = [0x18, 0x19, 0x1A, 0x1B], solid = 0 },
]

