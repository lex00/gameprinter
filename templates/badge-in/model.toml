[model]
schema = "0.4.0"
name = "badge_in"
title = "Badge In"
description = "An original: the return-to-office mandate as a platformer. Badge in at the far end of each floor before the clock runs out, past middle managers, a printer that jams and reply-all chains. Its mechanics are composed from Moss Hop's player and Super Mario Bros.' walkers, shells and bullets, scaled to the player's walking speed (docs/originals.md)"
source = "badge-in"
view = "side"
frame_rate = "60"
systems = ["rules", "entity_states", "counters", "spawn", "platformer.player", "platformer.enemies", "platformer.contact", "exits", "camera"]
start_level = "lobby"

[model.extensions]
platformer = "0.4.0"

[input]
device = "nes-pad"

[input.actions]
jump = "a"
left = "left"
right = "right"
run = "b"

[assets.hot_desks]
kind = "level-grid"
role = "layout"

[assets.hot_desks.from]
source = "badge-in"
asset = "hot_desks"

[assets.lobby]
kind = "level-grid"
role = "layout"

[assets.lobby.from]
source = "badge-in"
asset = "lobby"

[assets.metatiles]
kind = "metatiles"
role = "tileset"
description = "Air, carpet, desk, cubicle wall, filing cabinet, window, and the badge reader's two halves"
item_roles = ["background", "terrain", "platform", "terrain", "terrain", "background", "goal", "goal"]

[assets.metatiles.from]
source = "badge-in"
asset = "metatiles"

[assets.open_plan]
kind = "level-grid"
role = "layout"

[assets.open_plan.from]
source = "badge-in"
asset = "open_plan"

[assets.palettes]
kind = "palettes"
role = "palettes"
item_roles = ["background", "platform", "background", "goal", "player", "enemy", "hazard", "collectible"]

[assets.palettes.from]
source = "badge-in"
asset = "palettes"

[assets.tiles]
kind = "tiles"
role = "graphics"
description = "Generated stub tiles"

[assets.tiles.from]
source = "badge-in"
asset = "tiles"

[entities.associate]
description = "A mid-level associate with a lanyard and somewhere to be"
role = "player"
size = [16, 16]
tile_collision = true

[entities.associate.hitbox]
h = 16
w = 12
x = 2
y = 0

[entities.associate.jump]
action = "jump"
gravity = "0.25"
max_fall = 4
speed = -5

[entities.associate.run]
air_control = true
run_action = "run"
run_speed = 2
walk_speed = 1

[entities.associate.sprite]
flip_when_facing_left = true
palette = 4
slot = "tiles"
tiles = [64, 65, 80, 81]
width = 2

[entities.coffee]
description = "A cup of office coffee"
role = "collectible"
size = [16, 16]

[entities.coffee.contact]
otherwise = "collect"

[entities.coffee.hitbox]
h = 12
w = 8
x = 4
y = 2

[entities.coffee.sprite]
palette = 7
slot = "tiles"
tiles = [72, 73, 88, 89]
width = 2

[entities.middle_manager]
description = "Walks toward you to ask whether you have a minute. Stomping one delegates it"
role = "enemy"
size = [16, 16]
tile_collision = true

[entities.middle_manager.contact]
bounce = -3
otherwise = "kill-player"
stomp_depth = 7

[entities.middle_manager.fall]
gravity = "0.23828125"
max_fall = 3

[entities.middle_manager.hitbox]
h = 12
w = 10
x = 3
y = 4

[entities.middle_manager.sprite]
flip_when_facing_left = true
palette = 5
slot = "tiles"
tiles = [66, 67, 82, 83]
width = 2

[entities.middle_manager.walk]
speed = "0.3333282470703125"

[entities.printer]
description = "A printer on casters. Stomped, it jams; kicked, it slides across the floor and takes out anyone in its way"
role = "enemy"
size = [16, 16]
tile_collision = true

[entities.printer.contact]
bounce = -3
keep_on_stomp = true
otherwise = "kill-player"
stomp_depth = 7

[entities.printer.fall]
gravity = "0.23828125"
max_fall = 3

[entities.printer.hitbox]
h = 12
w = 12
x = 2
y = 4

[entities.printer.machine]
initial = "rolling"

[entities.printer.machine.states.jammed]
description = "PC LOAD LETTER: it sits still, and a touch kicks it"

[entities.printer.machine.states.jammed.set.contact]
otherwise = "kick"

[entities.printer.machine.states.jammed.set.walk]
speed = 0

[[entities.printer.machine.states.jammed.transition]]
on = "enemy.kicked"
to = "sliding"

[[entities.printer.machine.states.jammed.transition]]
after = 336
to = "rolling"

[[entities.printer.machine.states.rolling.transition]]
on = "enemy.stomped"
to = "jammed"

[entities.printer.machine.states.sliding.set.contact]
otherwise = "kill-player"

[entities.printer.machine.states.sliding.set.walk]
speed = 2

[[entities.printer.machine.states.sliding.transition]]
on = "enemy.stomped"
to = "jammed"

[entities.printer.sprite]
flip_when_facing_left = true
palette = 6
slot = "tiles"
tiles = [68, 69, 84, 85]
width = 2

[entities.printer.walk]
speed = "0.3333282470703125"

[entities.reply_all]
description = "An email to the whole company, flying left at head height. Stomping it unsubscribes"
role = "projectile"
size = [16, 16]

[entities.reply_all.contact]
bounce = -3
otherwise = "kill-player"
stomp_depth = 7

[entities.reply_all.fly]
heading = "left"
speed = 1

[entities.reply_all.hitbox]
h = 8
w = 12
x = 2
y = 4

[entities.reply_all.sprite]
palette = 6
slot = "tiles"
tiles = [70, 71, 86, 87]
width = 2

[levels.hot_desks]
description = "The ninth floor: hot desks over missing floor, cabinets to climb and the last badge reader"
grid = "hot_desks"
kill_below = 208
size = [64, 15]
solid_property = "solid"
spawn_ahead = 32
tile_size = 16
tileset = "metatiles"

[levels.hot_desks.counters]
clock = 120

[levels.hot_desks.goal]
x = 980

[[levels.hot_desks.spawn]]
entity = "associate"
x = 24
y = 176

[[levels.hot_desks.spawn]]
entity = "coffee"
