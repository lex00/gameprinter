y = 96

[[levels.hot_desks.spawn]]
entity = "middle_manager"
x = 384
y = 176

[[levels.hot_desks.spawn]]
entity = "reply_all"
x = 560
y = 120

[[levels.hot_desks.spawn]]
entity = "printer"
x = 672
y = 176

[[levels.hot_desks.spawn]]
entity = "middle_manager"
x = 896
y = 176

[levels.lobby]
description = "The ground floor: turnstiles, a gap in the marble and the first manager"
grid = "lobby"
kill_below = 208
next = "open_plan"
size = [48, 15]
solid_property = "solid"
tile_size = 16
tileset = "metatiles"

[levels.lobby.counters]
clock = 90

[levels.lobby.goal]
x = 724

[[levels.lobby.spawn]]
entity = "associate"
x = 24
y = 176

[[levels.lobby.spawn]]
entity = "middle_manager"
x = 368
y = 176

[[levels.lobby.spawn]]
entity = "coffee"
x = 528
y = 128

[levels.open_plan]
description = "The fourth floor: cubicles, two gaps, a printer and a reply-all chain"
grid = "open_plan"
kill_below = 208
next = "hot_desks"
size = [64, 15]
solid_property = "solid"
spawn_ahead = 32
tile_size = 16
tileset = "metatiles"

[levels.open_plan.counters]
clock = 120

[levels.open_plan.goal]
x = 980

[[levels.open_plan.spawn]]
entity = "associate"
x = 24
y = 176

[[levels.open_plan.spawn]]
entity = "middle_manager"
x = 240
y = 176

[[levels.open_plan.spawn]]
entity = "coffee"
x = 208
y = 112

[[levels.open_plan.spawn]]
entity = "printer"
x = 464
y = 176

[[levels.open_plan.spawn]]
entity = "reply_all"
x = 640
y = 168

[[levels.open_plan.spawn]]
entity = "middle_manager"
x = 784
y = 176

[cameras.main]
follow = "associate"
axis = "x"
size = [256, 240]
lead = [112, 0]
clamp_to_level = true

[rules.game]
initial = "playing"

[rules.game.states.badged_in]
description = "Badged in on time; the elevator to the next floor"
freeze = true

[[rules.game.states.badged_in.transition]]
to = "playing"
after = 60
do = ["next-level"]

[rules.game.states.dying]
description = "Late, or worse: the floor waits a moment, then starts again"
freeze = true

[[rules.game.states.dying.transition]]
to = "playing"
after = 90
do = ["restart-level"]

[rules.game.states.dying.transition.if]
counter = "lives"
cmp = ">"
value = 0

[[rules.game.states.dying.transition]]
to = "laid_off"
after = 90

[rules.game.states.laid_off]
description = "Out of lives: the game is over"
freeze = true

[[rules.game.states.playing.transition]]
to = "dying"
on = "player.died"
do = ["change:lives:-1"]

[[rules.game.states.playing.transition]]
to = "dying"
on = "clock.reached_min"
do = ["change:lives:-1"]

[[rules.game.states.playing.transition]]
to = "promoted"
on = "goal.reached"

[rules.game.states.playing.transition.if]
counter = "floors"
cmp = ">="
value = 3

[[rules.game.states.playing.transition]]
to = "badged_in"
on = "goal.reached"

[rules.game.states.promoted]
description = "Badged in on the top floor: the game is won"
freeze = true

[counters.clock]
description = "Seconds until the standup, counted every 60 frames"
min = 0

[[counters.clock.change]]
every = 60
by = -1

[counters.coffee]
max = 99

[[counters.coffee.change]]
on = "item.collected"

[[counters.delegated.change]]
on = "enemy.stomped"

[[counters.floors.change]]
on = "goal.reached"

[counters.lives]
start = 3
min = 0

