# The Donkey Kong bench (`gp bench clips donkey-kong`, `gp bench scratch
# donkey-kong`, docs/benchmarks.md). Paths are under the games checkout
# ($GP_GAMES_DIR, else ../games beside the repo). The answer key is the
# package's own hand-written model and state mapping; Donkey Kong has no
# source, so the rows game-printer graded against Moss Hop's source say
# they need one. Nothing here is ROM data.

[bench]
template = "donkey-kong"
seeds = [1, 2]
dense_budget = 400
dense_keep = 15

[wrong_model]
says = "the barrel's hitbox one pixel taller"
set = { "entities.barrel.hitbox.h" = 5 }

[grade]
model = "donkey-kong"

[scratch]
rounds = 2
# Stage 0: the static harvest from the ROM alone, its facts in its own
# names (no answer key is read).
static_command = ["model", "static", "{rom}", "--model", "{model}"]
recordings = 4
