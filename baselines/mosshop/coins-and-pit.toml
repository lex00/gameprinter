# Moss Hop (docs/reference-game.md): jumps the step and the first slug,
# lands on it at frame 105 (squashed, ENEMY_STATE 2, for 30 frames), takes
# the two coins over the pit at frames 109 and 125, and falls in, dying at
# frame 139. The level starts over at frame 229: the slug and both coins
# are back, and COINS keeps counting.
#
# The 5 lag frames are at power-on.

schema = 0
source = "mosshop"
sha256 = "44fcedf5050970a0ae6cf10c76ac80d9628f663416c22adb8432a43b0c953ec4"
description = "Stomp the first slug, take the two coins over the pit and fall into it"
frames = 260
holds = ["right+b@10-70", "a@26-28", "a@68-70", "right@71-"]
frame_hashes = "b38b7a28bc2a7f5b7a4f36c52a29a795f4c469bfc09c934a2f737616c366aeaf"
lag_frames = 5

