# Moss Hop (docs/reference-game.md): jumps the step, lands behind the first
# slug and runs into it at frame 74. The player hops up (PLAYER_VY -4),
# falls through the ground and off the screen (PLAYER_Y_HI 1), and the
# level starts over 90 frames later with a life fewer.
#
# The 5 lag frames are at power-on.

schema = 0
source = "mosshop"
sha256 = "44fcedf5050970a0ae6cf10c76ac80d9628f663416c22adb8432a43b0c953ec4"
description = "Run into the first slug on the ground, hop off the screen and start over"
frames = 240
holds = ["right+b@10-90", "a@30-32"]
frame_hashes = "45dc4665097d8fcb072ea60b181816edef8732f7137e115428b3b510a764e5e7"
lag_frames = 5

