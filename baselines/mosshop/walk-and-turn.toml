# Moss Hop (docs/reference-game.md): walks right at a pixel a frame, jumps
# at frame 21, and in the air meets the side of the ? block at x 50, which
# stops it; then turns left at frame 42, has landed by frame 60 and walks
# back to x 10.
#
# The 5 lag frames are at power-on.

schema = 0
source = "mosshop"
sha256 = "44fcedf5050970a0ae6cf10c76ac80d9628f663416c22adb8432a43b0c953ec4"
description = "Walk right, jump into the side of the ? block, turn left in the air and walk back"
frames = 120
holds = ["right@10-40", "a@20-22", "left@41-80"]
frame_hashes = "1caf1708ef43cf3621da2064d180bd0a2b6ae36c213f5d850c9ba737f89ffe7f"
lag_frames = 5

